#
# Release pipeline.
#
# Trigger: MANUAL `workflow_dispatch` ONLY (owner directive 2026-09-16). Merging a
# version bump to `main` publishes NOTHING; a release happens only when someone (or the
# release train) dispatches this workflow. Every `test_*.yml` is a `workflow_call`
# child with no publish path of its own.
#
# Input `dry_run` (default false): run every test and build job and publish NOTHING —
# no npm publish, no tag, no GitHub Release, no AssetLib edit, no Discord. Every
# side-effecting job carries a job-level `if: inputs.dry_run != true`, so the run graph
# shows them `skipped`.
#
# Guards (first job, `check-version-tag`):
#   * ref guard     — a non-dry run on any ref other than `refs/heads/main` FAILS.
#   * version guard — the version is read from addons/godot_mcp/plugin.cfg (the SINGLE
#                     source of truth — see docs/RELEASING.md) at the dispatched commit.
#                     If tag `v<version>` already exists a real run FAILS (a dispatch
#                     never "succeeds" having done nothing); a dry run warns and continues.
#
# Order: full tests -> build (addon zip) -> publish godot-cli to npm (`publish-npm`,
# idempotent: skipped when the exact version is already on npm) -> tag + GitHub Release
# (addon zip) -> post-publish verification (npm + Release/asset present, then the
# from-scratch e2e install of the JUST-PUBLISHED godot-cli from the registry across the
# Godot matrix) -> AssetLib version edit (advisory) -> Discord. The tag/Release come
# AFTER the npm publish so a re-dispatch after a failed publish is possible (the
# version guard only trips once the tag exists). The run is green only if the
# post-publish e2e install passed.
#
# The engine CLI `godot-cli` npm publish is the terminal publish leg of THIS plugin's
# release and lives here — it is never released standalone. The `npm publish` step MUST
# live DIRECTLY in this workflow file (not in a reusable workflow): the npm Trusted
# Publisher (OIDC) binding is to this repo + `release.yml`, and reusable-workflow
# bindings are a known npm Trusted Publishing limitation under workflow_dispatch.
#
# The publish jobs `needs:` the full deterministic test set — the .NET build+test, the
# godot-cli node tests (test_cli.yml), and the Godot matrix (4.3 → 4.7) addon-load
# smoke, dock-reload guard and from-scratch e2e install.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: run every test + build job, publish NOTHING (no npm, no tag, no Release, no AssetLib, no Discord)."
        required: false
        default: false
        type: boolean

# One release at a time per repo; never cancel an in-flight release.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege defaults; the `publish-npm` job elevates id-token for OIDC.
permissions:
  contents: write

jobs:
  # Guards + version resolution. Runs first; everything else needs it.
  check-version-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      tag_exists: ${{ steps.tag_exists.outputs.exists }}
      server_version: ${{ steps.server_version.outputs.server_version }}
    steps:
      # Ref guard: a real (non-dry) release may only be cut from main.
      - name: Ref guard (non-dry runs must be on refs/heads/main)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" != "true" ] && [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::A real release (dry_run=false) must be dispatched on refs/heads/main; got ${REF}. Re-dispatch on main, or set dry_run=true."
            exit 1
          fi
          echo "Ref guard OK: ref=${REF} dry_run=${DRY_RUN}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Single-source the harness server version from the addon's authoritative constant
      # (GodotMcpServerView.ServerVersion) so the advisory runtime-harness legs download the
      # server release the addon actually pins — never a stale hardcoded default.
      - name: Read ServerVersion from the addon constant
        id: server_version
        run: |
          set -euo pipefail
          src="addons/godot_mcp/Runtime/Connection/GodotMcpServerView.cs"
          server_version="$(grep -oE 'ServerVersion[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' "$src" \
            | head -n1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          if [ -z "${server_version}" ]; then
            echo "::error::Could not read ServerVersion from ${src}"
            exit 1
          fi
          echo "server_version=${server_version}" >> "$GITHUB_OUTPUT"
          echo "Addon-pinned server version: ${server_version}"

      # Server-pin advisory (moved from the local release script): per docs/RELEASING.md
      # the pinned `v<ServerVersion>` GameDev-MCP-Server release must already exist before
      # an addon release that pins it. WARNING only — never fails the run.
      - name: Server-pin advisory (pinned GameDev-MCP-Server release exists)
        env:
          SERVER_VERSION: ${{ steps.server_version.outputs.server_version }}
        run: |
          set -uo pipefail
          if git ls-remote --exit-code --tags https://github.com/IvanMurzak/GameDev-MCP-Server.git "refs/tags/v${SERVER_VERSION}" >/dev/null 2>&1; then
            echo "Server-pin advisory OK: GameDev-MCP-Server v${SERVER_VERSION} exists."
          else
            echo "::warning::Pinned GameDev-MCP-Server release v${SERVER_VERSION} was NOT found (or could not be queried). Consumers' local server download will 404 until it exists (docs/RELEASING.md § Server version pin). Advisory only."
          fi

      # plugin.cfg is an INI file, so read its `version="x.y.z"` line directly
      # rather than with npm-get-version-action (which expects a package.json).
      - name: Get version from plugin.cfg
        id: get_version
        run: |
          set -euo pipefail
          version="$(grep -E '^version=' addons/godot_mcp/plugin.cfg | head -n1 | sed -E 's/^version="?([^"]*)"?.*/\1/')"
          if [ -z "${version}" ]; then
            echo "::error::Could not read version= from addons/godot_mcp/plugin.cfg"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (tag v${version})"

      - name: Check if tag exists
        id: tag_exists
        uses: mukunku/tag-exists-action@v1.7.0
        with:
          tag: ${{ steps.get_version.outputs.tag }}

      # Version guard: an already-tagged version cannot be released again. A real run
      # fails loudly here instead of "succeeding" with every publish job skipped.
      - name: Version guard (tag must not exist yet)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ steps.get_version.outputs.tag }}
          TAG_EXISTS: ${{ steps.tag_exists.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "${TAG_EXISTS}" = "true" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning::Tag ${TAG} already exists — a real release of this version would FAIL. Dry run continues."
            else
              echo "::error::Tag ${TAG} already exists: this version is already released. Bump addons/godot_mcp/plugin.cfg (node scripts/bump-version.mjs <new>), merge to main, then dispatch again."
              exit 1
            fi
          else
            echo "Version guard OK: ${TAG} does not exist yet."
          fi

  # --- TEST GATE (runs on every dispatch, dry or real) ---

  # .NET build + xUnit (mirrors ci.yml). Required before a release is cut.
  dotnet-build-test:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Godot-MCP.sln

      - name: Build
        run: dotnet build Godot-MCP.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test Godot-MCP.Tests/Godot-MCP.Tests.csproj --configuration Debug --no-build --verbosity normal

  # godot-mcp-cli node tests (Node 20 & 22). Required before a release is cut.
  test-cli:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli.yml

  # godot_mcp addon-load smoke across the Godot engine matrix (mono).
  test-godot-4-3:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_plugin.yml
    with:
      godotVersion: "4.3.0"

  test-godot-4-4:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_plugin.yml
    with:
      godotVersion: "4.4.0"

  test-godot-4-5:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_plugin.yml
    with:
      godotVersion: "4.5.1"

  test-godot-4-6:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_plugin.yml
    with:
      godotVersion: "4.6.3"

  test-godot-4-7:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_plugin.yml
    with:
      godotVersion: "4.7.0"

  # in-session-rebuild dock-survival guard across the Godot engine matrix (mono):
  # boots a headless editor held open with the dev-control bridge, triggers a genuine
  # in-session C# rebuild, and asserts the "AI Game Developer" dock SURVIVES the hot
  # reload (godotengine/godot#51626). Gates the release alongside the addon-load smoke
  # so the "missing dock tab" regression can NEVER ship. MUST stay in lockstep with
  # test_pull_request.yml's dock-reload-4-{3..7} legs.
  dock-reload-4-3:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_dock_reload.yml
    with:
      godotVersion: "4.3.0"

  dock-reload-4-4:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_dock_reload.yml
    with:
      godotVersion: "4.4.0"

  dock-reload-4-5:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_dock_reload.yml
    with:
      godotVersion: "4.5.1"

  dock-reload-4-6:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_dock_reload.yml
    with:
      godotVersion: "4.6.3"

  dock-reload-4-7:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_dock_reload.yml
    with:
      godotVersion: "4.7.0"

  # from-scratch terminal-install E2E across the Godot engine matrix (mono). Gates
  # the release alongside the addon-load smoke so a broken from-scratch terminal
  # install (create-project + install-plugin) can NEVER ship in a release.
  e2e-install-4-3:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.3.0"

  e2e-install-4-4:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.4.0"

  e2e-install-4-5:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.5.1"

  e2e-install-4-6:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.6.3"

  e2e-install-4-7:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.7.0"

  # godot_mcp runtime INTEGRATION harness across the Godot engine matrix (mono):
  # downloads the released gamedev-mcp-server, boots a headless game with the
  # in-game runtime + error capture, and asserts the live SignalR roundtrip +
  # runtime-error capture (issue #186). Gates the release alongside the addon-load
  # smoke so a transport/capture regression cannot ship in a release.
  # serverVersion is single-sourced from the addon constant (check-version-tag.server_version),
  # so these advisory legs download the server release the addon actually pins.
  # `advisory: true` runs the harness job with continue-on-error, so a red harness leg cannot
  # turn this release run red AFTER publishing (the release train judges the run conclusion).
  # They stay out of the publish `needs:` and stay BLOCKING on PR CI (advisory defaults false).
  runtime-harness-4-3:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_runtime_harness.yml
    with:
      godotVersion: "4.3.0"
      serverVersion: ${{ needs.check-version-tag.outputs.server_version }}
      advisory: true

  runtime-harness-4-4:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_runtime_harness.yml
    with:
      godotVersion: "4.4.0"
      serverVersion: ${{ needs.check-version-tag.outputs.server_version }}
      advisory: true

  runtime-harness-4-5:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_runtime_harness.yml
    with:
      godotVersion: "4.5.1"
      serverVersion: ${{ needs.check-version-tag.outputs.server_version }}
      advisory: true

  runtime-harness-4-6:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_runtime_harness.yml
    with:
      godotVersion: "4.6.3"
      serverVersion: ${{ needs.check-version-tag.outputs.server_version }}
      advisory: true

  runtime-harness-4-7:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_godot_runtime_harness.yml
    with:
      godotVersion: "4.7.0"
      serverVersion: ${{ needs.check-version-tag.outputs.server_version }}
      advisory: true

  # --- BUILD (runs on every dispatch, dry or real; after the full test set) ---

  # Build + test + package the addon zip (the Godot deliverable — there is no compiled
  # artifact to ship). Split from the Release job so a dry run still proves the package
  # builds. The zip is handed to release-addon as a workflow artifact.
  build-addon:
    runs-on: ubuntu-latest
    # The build + every publish job depend ONLY on the DETERMINISTIC test legs
    # (check-version-tag, the .NET build+test, the cli node tests, the addon-LOAD godot
    # smoke, the in-session-rebuild dock-survival guard (dock-reload), and the
    # from-scratch e2e-install) across the FULL Godot matrix (4.3 → 4.7). This MUST stay
    # in lockstep with test_pull_request.yml's matrix so a green PR can never produce a
    # red release gate — when you add/remove a Godot version, edit BOTH files together.
    # The runtime-harness-4-{3..7} legs are deliberately NOT in this `needs:` array: they
    # are an end-to-end INTEGRATION harness that downloads an external server release and
    # runs a live, concurrency-sensitive roundtrip — a transient harness flake or an
    # unavailable upstream server release must NEVER block a Godot-MCP release. They still
    # RUN on every dispatch (advisory signal, and a red leg reddens the run conclusion);
    # they remain BLOCKING on PR CI (test_pull_request.yml), so main is always
    # harness-green before a release is dispatched.
    needs:
      [
        check-version-tag,
        dotnet-build-test,
        test-cli,
        test-godot-4-3,
        test-godot-4-4,
        test-godot-4-5,
        test-godot-4-6,
        test-godot-4-7,
        dock-reload-4-3,
        dock-reload-4-4,
        dock-reload-4-5,
        dock-reload-4-6,
        dock-reload-4-7,
        e2e-install-4-3,
        e2e-install-4-4,
        e2e-install-4-5,
        e2e-install-4-6,
        e2e-install-4-7,
      ]
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # Sanity build + test before producing the zip, so a release is never cut
      # on a red commit. Godot.NET.Sdk is a NuGet SDK -> no Godot binary needed.
      - name: Restore
        run: dotnet restore Godot-MCP.sln

      - name: Build
        run: dotnet build Godot-MCP.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test Godot-MCP.Tests/Godot-MCP.Tests.csproj --configuration Debug --no-build --verbosity normal

      # Package only the addon SOURCE folder (the deliverable — Godot has no
      # compiled artifact to ship). Exclude dev cruft so the zip is install-clean.
      - name: Package addon zip
        id: package
        run: |
          set -euo pipefail
          version="${{ needs.check-version-tag.outputs.version }}"
          zip_name="godot-mcp-addon-${version}.zip"
          # Zip the addons/ tree so the archive expands to addons/godot_mcp/...,
          # which drops straight into a consumer project's res:// root.
          zip -r "${zip_name}" addons/godot_mcp \
            -x '*.uid' \
            -x '*.import' \
            -x '*/bin/*' \
            -x '*/obj/*' \
            -x '*/.godot/*'
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "Created ${zip_name}:"
          unzip -l "${zip_name}"

      - name: Upload addon zip
        uses: actions/upload-artifact@v6
        with:
          name: godot-mcp-addon
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 7

  # NOTE: the MCP server is NOT built or released here anymore. The addon consumes the
  # shared GameDev-MCP-Server (https://github.com/IvanMurzak/GameDev-MCP-Server), whose
  # own release workflow publishes the `gamedev-mcp-server-<rid>.zip` assets the addon
  # downloads at the version pinned by `GodotMcpServerView.ServerVersion`. That pinned
  # `v<ServerVersion>` release must already exist BEFORE cutting an addon release.

  # --- PUBLISH (real runs only; gated on every deterministic test + the build) ---

  # Publish godot-cli (cli/) to npm via OIDC Trusted Publishing with build provenance.
  # FIRST side effect, BEFORE the tag/Release, so a failed publish can be re-dispatched
  # (the version guard only trips once the tag exists). Idempotent: `npm publish` is
  # skipped when the exact version is already on the registry. Inline (NOT a reusable
  # workflow) — see the header.
  #
  # First-publish prerequisite (owner action): the `godot-cli` package needs an npm
  # Trusted Publisher authorizing THIS repository + `release.yml`. There is NO
  # NPM_TOKEN secret — auth is exchanged at runtime via the `id-token: write` OIDC token.
  # See https://docs.npmjs.com/trusted-publishers
  publish-npm:
    name: publish godot-cli to npm
    runs-on: ubuntu-latest
    needs:
      [
        check-version-tag,
        build-addon,
        dotnet-build-test,
        test-cli,
        test-godot-4-3,
        test-godot-4-4,
        test-godot-4-5,
        test-godot-4-6,
        test-godot-4-7,
        dock-reload-4-3,
        dock-reload-4-4,
        dock-reload-4-5,
        dock-reload-4-6,
        dock-reload-4-7,
        e2e-install-4-3,
        e2e-install-4-4,
        e2e-install-4-5,
        e2e-install-4-6,
        e2e-install-4-7,
      ]
    if: inputs.dry_run != true
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing — no NPM_TOKEN needed.
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The GitHub-hosted runner's Node 22 bundle ships npm 10.9.8, but npm OIDC
      # Trusted Publishing requires npm >= 11.5.1 (older npm never performs the
      # OIDC token exchange, so the publish PUT fails auth with a masked E404).
      # Upgrade npm before any publish step. See: https://docs.npmjs.com/trusted-publishers
      - name: Upgrade npm (OIDC Trusted Publishing requires npm >= 11.5.1)
        # Pin to the 11.x major: npm 12.0.0 (2026-07-09) regressed
        # `npm publish --provenance` (fails "Cannot find module 'sigstore'").
        # 11.x satisfies the >= 11.5.1 OIDC floor and has working provenance.
        run: npm install -g npm@11

      - name: Resolve version
        id: version
        run: |
          version="${{ needs.check-version-tag.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing godot-cli version: ${version}"

      # Align the cli package.json version to the release version so the
      # published artifact matches the GitHub Release tag. plugin.cfg is the
      # single source of truth for the release version (see docs/RELEASING.md);
      # this writes that value into the cli at publish time. --allow-same-version
      # makes it a no-op when cli/package.json already matches.
      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Idempotency: skip the publish when this exact version is already on the registry.
      # `npm view <pkg>@<v> version` prints the version when it exists and nothing when it
      # does not (a never-published package errors with E404, also read as "absent").
      - name: Check whether this version is already on npm
        id: npm_exists
        run: |
          set -uo pipefail
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"
          got="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ "${got}" = "${version}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm — skipping npm publish (idempotent re-run)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is not on npm yet — publishing."
          fi

      - name: Publish to npm with provenance
        if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish --access public --provenance

  # Cut the GitHub Release + `v<version>` tag with the addon zip attached and
  # auto-generated notes. The server binaries are NOT attached — the addon downloads
  # the shared GameDev-MCP-Server release pinned by ServerVersion.
  release-addon:
    runs-on: ubuntu-latest
    needs: [check-version-tag, build-addon, publish-npm]
    if: inputs.dry_run != true
    outputs:
      version: ${{ needs.check-version-tag.outputs.version }}
      tag: ${{ needs.check-version-tag.outputs.tag }}
      published: ${{ steps.mark.outputs.published }}
      release_notes: ${{ steps.read_notes.outputs.release_body }}
    steps:
      - name: Download addon zip
        uses: actions/download-artifact@v7
        with:
          name: godot-mcp-addon

      # tag_name is the `v<version>` computed from plugin.cfg. target_commitish pins the
      # new tag to the dispatched (tested) commit, never to whatever main points at now.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.check-version-tag.outputs.tag }}
          tag_name: ${{ needs.check-version-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ needs.build-addon.outputs.zip_name }}

      - name: Mark publish success
        id: mark
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      # Expose the just-published release body as a job output so publish_discord
      # can announce it. Unlike Unity-MCP (which builds a release-notes artifact
      # and reads ./release-notes/release.md), this repo has NO release-notes
      # file — the body is GENERATED BY GITHUB via `generate_release_notes: true`
      # above, so the only source is reading it back from the API.
      #
      # SAFETY: this step is purely informational and must NEVER be able to fail
      # the release. It runs AFTER `mark` (so `published` is already set), is
      # `continue-on-error`, and its script is internally non-fatal (no `set -e`,
      # every command `|| true`-guarded). Worst case the notes come back empty
      # and Discord gets the tag + release link.
      - name: Read release notes into job output
        id: read_notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version-tag.outputs.tag }}
        run: |
          set -uo pipefail
          body=""
          for attempt in 1 2 3; do
            body="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body' 2>/dev/null || true)"
            if [ -n "${body}" ]; then
              break
            fi
            echo "Generated release body not readable yet (attempt ${attempt}/3); retrying in 5s..."
            sleep 5
          done
          if [ -z "${body}" ]; then
            echo "::warning::Could not read the generated release body for ${TAG}; falling back to the tag name."
            body="Release ${TAG}"
          fi
          # Randomized heredoc delimiter so a release-notes line that happens to
          # match the sentinel cannot terminate the heredoc early.
          DELIM="ENDOFRELEASEBODY_$(openssl rand -hex 16)"
          {
            printf 'release_body<<%s\n' "$DELIM"
            printf '%s\n' "$body"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

  # --- POST-PUBLISH VERIFICATION (real runs only) ---

  # Moved from the local release script (wait-release-and-npm.py): prove the release
  # ACTUALLY published — godot-cli@<version> is resolvable on registry.npmjs.org (polled,
  # 5-min cap, name AND version must match) and the GitHub Release on the v-prefixed tag
  # carries godot-mcp-addon-<version>.zip. Fails the run otherwise.
  verify-published:
    runs-on: ubuntu-latest
    needs: [check-version-tag, publish-npm, release-addon]
    if: inputs.dry_run != true
    permissions:
      contents: read
    steps:
      - name: Wait for godot-cli@<version> on the npm registry
        env:
          VERSION: ${{ needs.check-version-tag.outputs.version }}
        run: |
          set -uo pipefail
          url="https://registry.npmjs.org/godot-cli/${VERSION}"
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            body="$(curl -sS --max-time 20 -H 'Accept: application/json' "$url" 2>/dev/null || true)"
            got="$(printf '%s' "$body" | jq -r 'select(type=="object") | "\(.name)@\(.version)"' 2>/dev/null || true)"
            if [ "$got" = "godot-cli@${VERSION}" ]; then
              echo "npm OK: ${got}"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::godot-cli@${VERSION} is not resolvable on registry.npmjs.org after 300s (last read: '${got}'). The publish-npm job reported success — check the npm publish step / Trusted Publisher config."
              exit 1
            fi
            echo "godot-cli@${VERSION} not on npm yet (read: '${got}'); retrying in 15s..."
            sleep 15
          done

      - name: Verify the GitHub Release, tag and addon zip asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version-tag.outputs.tag }}
          VERSION: ${{ needs.check-version-tag.outputs.version }}
        run: |
          set -euo pipefail
          json="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,url,assets)"
          got_tag="$(jq -r '.tagName' <<<"$json")"
          if [ "$got_tag" != "$TAG" ]; then
            echo "::error::Release tagName is '${got_tag}', expected '${TAG}'."
            exit 1
          fi
          if ! jq -e --arg n "godot-mcp-addon-${VERSION}.zip" '[.assets[].name] | index($n) != null' <<<"$json" >/dev/null; then
            echo "::error::Release ${TAG} has no godot-mcp-addon-${VERSION}.zip asset (assets: $(jq -c '[.assets[].name]' <<<"$json"))."
            exit 1
          fi
          echo "Release OK: $(jq -r '.url' <<<"$json") with godot-mcp-addon-${VERSION}.zip"

  # From-scratch terminal install of the JUST-PUBLISHED release across the Godot matrix:
  # `godot-cli@<version>` installed from the npm registry, the addon downloaded by the
  # CLI's default path from the `v<version>` GitHub Release (no --source). The release
  # run is green only if every leg passes.
  e2e-published-4-3:
    needs: [check-version-tag, verify-published]
    if: inputs.dry_run != true
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.3.0"
      cliVersion: ${{ needs.check-version-tag.outputs.version }}

  e2e-published-4-4:
    needs: [check-version-tag, verify-published]
    if: inputs.dry_run != true
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.4.0"
      cliVersion: ${{ needs.check-version-tag.outputs.version }}

  e2e-published-4-5:
    needs: [check-version-tag, verify-published]
    if: inputs.dry_run != true
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.5.1"
      cliVersion: ${{ needs.check-version-tag.outputs.version }}

  e2e-published-4-6:
    needs: [check-version-tag, verify-published]
    if: inputs.dry_run != true
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.6.3"
      cliVersion: ${{ needs.check-version-tag.outputs.version }}

  e2e-published-4-7:
    needs: [check-version-tag, verify-published]
    if: inputs.dry_run != true
    uses: ./.github/workflows/test_cli_e2e_install.yml
    with:
      godotVersion: "4.7.0"
      cliVersion: ${{ needs.check-version-tag.outputs.version }}

  # --- DOWNSTREAM (real runs only; after the post-publish verification) ---

  # Auto-submit the Godot Asset Library VERSION EDIT for the just-released
  # version. Runs only after the published release was verified end to end.
  # This job is intentionally ISOLATED: nothing downstream needs it, so an
  # AssetLib failure shows up as a red job for visibility but never blocks the
  # npm publish or the Release. The one-time INITIAL submission + moderator
  # approval remain manual (see docs/RELEASING.md); this automates the
  # per-release EDIT only.
  #
  # Credentials/ids come ONLY from GitHub-managed config (never hardcoded):
  #   secrets.GODOT_ASSETLIB_USERNAME / secrets.GODOT_ASSETLIB_PASSWORD
  #   vars.GODOT_ASSETLIB_ASSET_ID
  # If they are not configured, the action fails auth (job red) but the release
  # and npm publish are unaffected.
  assetlib-edit:
    runs-on: ubuntu-latest
    needs:
      [
        check-version-tag,
        release-addon,
        verify-published,
        e2e-published-4-3,
        e2e-published-4-4,
        e2e-published-4-5,
        e2e-published-4-6,
        e2e-published-4-7,
      ]
    if: inputs.dry_run != true
    steps:
      - name: Checkout repository
        # The action reads the handlebars template (.github/assetlib/edit.hbs)
        # from the workspace, so the repo must be checked out.
        uses: actions/checkout@v6

      - name: Submit Asset Library version edit
        # deep-entertainment/godot-asset-lib-action @ v0.6.0
        # Pinned to the commit SHA for supply-chain safety (the action runs
        # arbitrary JS with the AssetLib credentials). Bump the SHA + the
        # version comment together when upgrading.
        uses: deep-entertainment/godot-asset-lib-action@056fa4060f062a8b209a5a6744a2726ad48d6bb0 # v0.6.0
        env:
          # Canonical version (from plugin.cfg via check-version-tag) and the
          # released commit (github.sha is the commit the v<version> tag points
          # at — release-addon cut the tag on this same commit). The handlebars
          # template reads these as {{ env.ASSETLIB_VERSION }} and
          # {{ env.ASSETLIB_DOWNLOAD_COMMIT }}.
          ASSETLIB_VERSION: ${{ needs.check-version-tag.outputs.version }}
          ASSETLIB_DOWNLOAD_COMMIT: ${{ github.sha }}
        with:
          action: addEdit
          username: ${{ secrets.GODOT_ASSETLIB_USERNAME }}
          password: ${{ secrets.GODOT_ASSETLIB_PASSWORD }}
          assetId: ${{ vars.GODOT_ASSETLIB_ASSET_ID }}
          assetTemplate: .github/assetlib/edit.hbs

  # Announce the just-cut GitHub Release in Discord (Unity-MCP parity — see the
  # `publish_discord` job in Unity-MCP's release.yml). LAST: fires only on a real run
  # whose release published AND passed the post-publish verification. Like
  # assetlib-edit this job is ISOLATED: nothing depends on it, so a webhook hiccup
  # surfaces as a red job for visibility but can never block or undo the release.
  publish_discord:
    runs-on: ubuntu-latest
    needs:
      [
        release-addon,
        verify-published,
        e2e-published-4-3,
        e2e-published-4-4,
        e2e-published-4-5,
        e2e-published-4-6,
        e2e-published-4-7,
      ]
    if: inputs.dry_run != true
    steps:
      - name: Send Release Notes to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_NOTES_WEBHOOK }}
          RELEASE_NOTES: ${{ needs.release-addon.outputs.release_notes }}
          VERSION: ${{ needs.release-addon.outputs.version }}
          TAG: ${{ needs.release-addon.outputs.tag }}
        run: |
          # Get the release notes from environment variables
          # (Using env vars avoids shell quoting issues with apostrophes in commit messages)
          release_notes="$RELEASE_NOTES"
          version="$VERSION"
          tag="$TAG"

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_NOTES_WEBHOOK is not configured — skipping the Discord announcement."
            exit 0
          fi

          # --- Unity-MCP formatting parity: synthesize the release-notes PREAMBLE ---
          # Unity-MCP hand-builds a `release.md` whose first lines are a
          # project+version heading, a "**Released:** *<date>*" line and a `---`
          # separator (see its `prepare-release-notes` job), and feeds that ONE file to
          # both the GitHub Release body and Discord — which is why its Discord post
          # opens with a large heading. This repo's release body is GitHub-generated
          # (`generate_release_notes: true`), so it has no heading by construction.
          # Prepending the same preamble here, BEFORE the shared cleanup below, makes
          # the rendered Discord message identical in shape to Unity's.
          # `date +'%B %e, %Y'` is copied verbatim from Unity-MCP (%e is space-padded)
          # so the date renders character-for-character the same as Unity's.
          today=$(date +'%B %e, %Y')
          release_notes="$(printf '# AI Game Developer (Godot MCP) %s\n**Released:** *%s*\n\n---\n\n%s\n' \
            "$tag" "$today" "$release_notes")"

          # Convert usernames to GitHub profile links
          # Convert "by @username" to "by [@username](https://github.com/username)"
          release_notes_with_links=$(echo "$release_notes" | sed -E 's/by @([A-Za-z0-9_-]+)/by [@\1](https:\/\/github.com\/\1)/g')

          # Remove horizontal separators (---) and clean up extra blank lines
          # 1. Remove lines containing only --- and whitespace
          # 2. Remove lines that contain only whitespace
          # 3. Compress multiple consecutive empty lines into one
          release_notes_cleaned=$(echo "$release_notes_with_links" | \
            sed '/^[[:space:]]*---[[:space:]]*$/d' | \
            sed 's/^[[:space:]]*$//' | \
            sed '/^$/N;/^\n$/d')

          # Create the release URL (the tag is `v<version>` from plugin.cfg)
          release_url="https://github.com/${{ github.repository }}/releases/tag/${tag}"

          # Append the release link to the notes
          full_message="${release_notes_cleaned}"$'\n\n'"📦 **[View Full Release](${release_url})**"

          # Discord has a 2000 character limit, so we'll truncate if needed
          if [ ${#full_message} -gt 2000 ]; then
            # Remove lines from the end until it fits, keeping the link
            link_text=$'\n\n'"📦 **[View Full Release](${release_url})**"
            # The truncated message is reassembled as `<notes>` + `\n...` + `<link>`,
            # so the ellipsis line costs 4 more characters on top of the link. Budget
            # for BOTH so the assembled message is provably <= 2000 (Unity-MCP omits
            # the ellipsis from its budget and can emit 2004 chars, which Discord
            # rejects with a 400 — see the report on this change). The heading
            # synthesized above is part of `release_notes_cleaned` and is therefore
            # kept by the loop below (it is the first lines); it simply consumes
            # budget that would otherwise hold more note lines.
            ellipsis_text=$'\n'"..."
            max_length=$((2000 - ${#link_text} - ${#ellipsis_text}))

            # Split into lines and rebuild until we exceed the limit
            truncated_notes=""
            while IFS= read -r line; do
              test_notes="${truncated_notes}${line}"$'\n'
              if [ ${#test_notes} -gt $max_length ]; then
                break
              fi
              truncated_notes="$test_notes"
            done <<< "$release_notes_cleaned"

            # Add ellipsis on its own line if we truncated
            full_message="${truncated_notes}"$'\n'"...${link_text}"
          fi

          # Create JSON payload for Discord webhook
          # flags: 4 sets the SUPPRESS_EMBEDS flag to suppress embeds/link previews.
          # See: https://discord.com/developers/docs/resources/channel#create-message
          json_payload=$(jq -n \
            --arg content "$full_message" \
            '{content: $content, flags: 4}')

          # Send to the Discord webhook and GATE ON THE RESPONSE.
          #
          # curl exits 0 on an HTTP error status, so a bare `curl -X POST` proves only
          # that a request was attempted -- never that Discord accepted it. Capture the
          # status explicitly: 400 (payload over the 2000-char limit), 429 (rate
          # limited) and 401/404 (revoked or wrong webhook) all used to leave this job
          # green with no announcement posted and nothing in the log to say so. That
          # blind spot is how the truncation-budget bug fixed above went unnoticed.
          #
          # `--retry 3` covers only what a retry can fix -- curl's transient set (429,
          # 5xx and timeouts), honouring Discord's `Retry-After` header -- and
          # `--retry-max-time` bounds it. A 4xx other than 429 is a permanent rejection
          # and is never retried, and neither is a refused connection (that would need
          # `--retry-connrefused`); both fail fast and loudly below. Accepted tradeoff:
          # a webhook execute has no idempotency key, so a retry whose predecessor was
          # actually processed (response lost in flight) can post the announcement
          # twice. A duplicate announcement is strictly better than a missing one.
          #
          # The webhook URL is a credential: it is never echoed and `-v` is never
          # passed (curl's own `-S` error text names at most the host). The response
          # body IS printed -- it is Discord's JSON error object, the single most
          # useful thing for whoever debugs the next failure.
          response_file="$(mktemp)"
          curl_exit=0
          http_code=$(curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$json_payload" \
            --retry 3 \
            --retry-max-time 60 \
            -o "$response_file" \
            -w '%{http_code}') || curl_exit=$?

          # Safe to fail here: nothing downstream depends on this job and the release is
          # already published, so a red step cannot block or undo it. It DOES redden the
          # workflow run conclusion (and the release badge) -- that is the intended
          # visibility, and the message below states exactly what did and did not ship.
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Discord announcement for version ${version} was NOT delivered (curl exit ${curl_exit}). The release itself is published; only the announcement is missing."
            exit 1
          fi

          case "$http_code" in
            2??)
              echo "Release notes accepted by Discord for version ${version} (HTTP ${http_code})."
              ;;
            *)
              echo "::error::Discord REJECTED the release notes for version ${version} (HTTP ${http_code}). The release itself is published; only the announcement is missing."
              echo "Discord response body:"
              head -c 2000 "$response_file"
              echo ""
              exit 1
              ;;
          esac
