# Reusable workflow: boot a headless Godot editor (mono / .NET build) of the
# requested version against the in-repo Godot-Tests/ project and assert the
# godot_mcp addon loads cleanly. Godot needs NO license (unlike Unity), so this
# uses the official Godot binaries via chickensoft-games/setup-godot — no
# game-ci. Called once per matrix version by test_pull_request.yml.
name: Test Godot Plugin

on:
  workflow_call:
    inputs:
      godotVersion:
        description: "Godot mono version to install and boot (e.g. 4.3.0, 4.4.0, 4.5.1)."
        required: true
        type: string
      lock:
        description: "chain lock JSON (empty on ordinary runs)"
        required: false
        default: ""
        type: string
      lock_hash8:
        description: "first 8 hex characters of the lock hash (empty on ordinary runs)"
        required: false
        default: ""
        type: string

# Chain leg (p2-chain-feed-script §C1-C5). Every chain step is a no-op when `lock` is empty.
# This job restores ONLY Godot-Tests/Godot-Tests.csproj, so `apply` and `record` are scoped to
# that consumer with the SAME --edges (the other csproj pins are named skipped[] rows).
# The per-run NUGET_PACKAGES `apply` exports lands in $GITHUB_ENV, so the `godot --headless`
# editor process below inherits it (the runtime assembly resolver reads it).
env:
  CHAIN_LOCK: ${{ inputs.lock }}
  CHAIN_LOCK_HASH8: ${{ inputs.lock_hash8 }}

jobs:
  test-godot-plugin:
    name: godot ${{ inputs.godotVersion }} (mono)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The in-repo test project. The addon is copied into <TEST_PROJECT>/addons/
      # at runtime (a dev junction does not survive checkout).
      TEST_PROJECT: Godot-Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # Chain runs only: the feed builds the net9.0 lower layers (ReflectorNet, McpPlugin).
      - name: Setup .NET 8 + 9 for the chain feed (chain runs only)
        if: env.CHAIN_LOCK != '' || contains(join(github.event.pull_request.labels.*.name, ' '), 'train/')
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: chain python (posix)
        if: runner.os != 'Windows' && env.CHAIN_PY == ''
        shell: bash
        run: |
          for c in python3 python; do
            if "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
              echo "CHAIN_PY=$c" >> "$GITHUB_ENV"; exit 0
            fi
          done
          echo 'chain: no Python 3.9+ on PATH (tried python3, python)' >&2; exit 2

      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node godot-mcp --job test-godot-plugin --edges Godot-Tests/Godot-Tests.csproj

      - name: Setup Godot ${{ inputs.godotVersion }} (mono)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ inputs.godotVersion }}
          use-dotnet: true
          include-templates: false

      - name: Report Godot version
        shell: bash
        run: godot --version --headless

      - name: Copy addon into the test project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${TEST_PROJECT}/addons/godot_mcp"
          mkdir -p "${TEST_PROJECT}/addons"
          cp -r addons/godot_mcp "${TEST_PROJECT}/addons/godot_mcp"
          test -f "${TEST_PROJECT}/addons/godot_mcp/plugin.cfg"
          test -f "${TEST_PROJECT}/addons/godot_mcp/Editor/GodotMcpPlugin.cs"

      - name: Import the project (generate .godot layout)
        shell: bash
        run: |
          set -uo pipefail
          # A cold CI checkout has no .godot/. Godot's `--build-solutions` is a
          # silent no-op until the project has been imported once (it materializes
          # the .godot/mono layout only on first editor import). Run an import pass
          # so the project is recognized before we build. Headless import prints
          # benign "progress dialog while flushing the message queue" warnings and
          # may exit non-zero on teardown — neither is fatal, so do NOT gate on the
          # import's exit code (the real gates are the emitted DLL below + the
          # plugin-loaded assertion). See ../../CLAUDE.md "Testbed runbook".
          godot --headless --path "${TEST_PROJECT}" --import --quit 2>&1 | tee import.log || true
          echo "Import pass complete."

      - name: Build C# (addon compiles into the project assembly)
        shell: bash
        run: |
          set -euo pipefail
          # Compile via `dotnet build` directly on the test project's .csproj
          # rather than `godot --build-solutions` — the latter silently no-ops in
          # a headless cold checkout (it produces no assembly and no diagnostics).
          # `dotnet build` is deterministic: Godot.NET.Sdk resolves GodotSharp from
          # nuget.org for the pinned SDK, and the addon's *.cs (copied in above)
          # globs into THIS project assembly, so a successful build proves the
          # addon's C# compiles against the frozen McpPlugin / ReflectorNet pins.
          # Output lands at .godot/mono/temp/bin/<Config>/Godot-MCP-Tests.dll.
          dotnet build "${TEST_PROJECT}/Godot-Tests.csproj" \
            --configuration Debug 2>&1 | tee build.log
          if ! ls "${TEST_PROJECT}"/.godot/mono/temp/bin/*/Godot-MCP-Tests.dll >/dev/null 2>&1; then
            echo "::error::C# build did not produce Godot-MCP-Tests.dll — the addon failed to compile."
            echo "----- build.log -----"
            cat build.log || true
            exit 1
          fi

      - name: Boot editor headless and assert addon loads
        shell: bash
        run: |
          set -euo pipefail
          # Boot the editor once; the godot_mcp EditorPlugin runs its _EnterTree
          # and prints "[Godot-MCP] plugin loaded". Capture stdout+stderr.
          godot --headless --path "${TEST_PROJECT}" --editor --quit \
            2>&1 | tee editor-boot.log || true

          echo "----- editor-boot.log -----"
          cat editor-boot.log

          if ! grep -qF "[Godot-MCP] plugin loaded" editor-boot.log; then
            echo "::error::'[Godot-MCP] plugin loaded' was NOT found — the addon did not load on Godot ${{ inputs.godotVersion }}."
            exit 1
          fi

          if grep -qE "FileNotFoundException|Cannot open file|Failed to load script|Unable to load addon|addon .* failed" editor-boot.log; then
            echo "::error::An addon-load / assembly-resolution error appeared in the editor boot output on Godot ${{ inputs.godotVersion }}."
            exit 1
          fi

          # Boot-time McpPlugin ctor skill-gen exception guard. McpPlugin 6.10.0 auto-runs skill generation in
          # its constructor and (after removing the silent CWD fallback, upstream #107) THROWS
          # InvalidOperationException "Cannot resolve relative SkillsPath 'SKILLS' …" when the addon hands it a
          # config with a relative SkillsPath and no ProjectRootPath. The ctor catches+logs it, so it is
          # non-fatal (the plugin still loads) — but it spams an ERROR + stack on every boot and the ctor's own
          # skill generation never runs. The addon must prime the config so ctor-time generation resolves to
          # <project>/.claude/skills instead of throwing (SkillsBootstrap.PrimeForCtorSkillGeneration). Anchor on
          # the exception-message text, which is version-stable, rather than McpPlugin's internal log prefix.
          if grep -qE "Cannot resolve relative SkillsPath|initial skill generation skipped|skill auto-generation skipped" editor-boot.log; then
            echo "::error::McpPlugin ctor skill-generation exception appeared in the editor boot output on Godot ${{ inputs.godotVersion }} (the addon did not set ConnectionConfig.ProjectRootPath / an absolute SkillsPath before McpPluginBuilder.Build())."
            exit 1
          fi

          echo "Godot ${{ inputs.godotVersion }}: addon loaded cleanly."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: godot-${{ inputs.godotVersion }}-logs
          path: |
            import.log
            build.log
            editor-boot.log
          if-no-files-found: ignore
          retention-days: 7

      - name: chain leg record
        id: chain_record
        if: always()
        shell: bash
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node godot-mcp --job test-godot-plugin --edges Godot-Tests/Godot-Tests.csproj --matrix "${{ inputs.godotVersion }}" --engine godot --engine-version "${{ inputs.godotVersion }}" --tier T3 --job-status "${{ job.status }}" --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
          if-no-files-found: error
