<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Godot MCP: AI agents such as Claude Code, Cursor, Codex and GitHub Copilot work in the Godot editor through the godot_mcp addon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="320" rx="20"/></clipPath>
    <path id="p1" d="M640 66 L780 160"/>
    <path id="p2" d="M640 160 L780 160"/>
    <path id="p3" d="M640 254 L780 160"/>
    <path id="p4" d="M780 160 L905 66"/>
    <path id="p5" d="M780 160 L905 254"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .ring { transform-origin: 780px 160px; animation: spin 26s linear infinite; }
    .ring.r2 { animation-duration: 40s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 780px 160px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .link { stroke-dasharray: 4 7; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <circle cx="780" cy="160" r="210" fill="url(#glow)"/>
    <circle cx="120" cy="290" r="200" fill="url(#glow2)"/>

    <!-- left: title block -->
    <g class="sans">
      <rect x="44" y="40" width="292" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="64" cy="56" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="78" y="62" font-size="15" font-weight="600" fill="#cbd5e1" letter-spacing=".4">GODOT 4.3+ · C# EDITOR ADDON</text>
      <text x="42" y="136" font-size="60" font-weight="700" fill="url(#title)" letter-spacing="-1">Godot MCP</text>
      <text x="44" y="180" font-size="23" fill="#e2e8f0">AI agents at work in the Godot editor:</text>
      <text x="44" y="210" font-size="23" fill="#e2e8f0">scenes, nodes, scripts, resources.</text>
      <rect x="44" y="236" width="262" height="48" rx="10" fill="#020617" fill-opacity="0.75" stroke="#334155"/>
      <text class="mono" x="64" y="267" font-size="18" fill="#94a3b8" textLength="216" lengthAdjust="spacing">$ <tspan fill="#e2e8f0">npm i -g </tspan><tspan fill="#67e8f9">godot-cli</tspan></text>
      <rect class="caret" x="286" y="251" width="9" height="20" fill="#67e8f9"/>
    </g>

    <!-- right: agents, the addon, the project -->
    <g fill="none" stroke-width="2">
      <use href="#p1" class="link" stroke="#67e8f9" stroke-opacity=".75"/>
      <use href="#p2" class="link" stroke="#a5b4fc" stroke-opacity=".75"/>
      <use href="#p3" class="link" stroke="#e879f9" stroke-opacity=".75"/>
      <use href="#p4" class="link" stroke="#34d399" stroke-opacity=".75"/>
      <use href="#p5" class="link" stroke="#34d399" stroke-opacity=".75"/>
    </g>
    <g>
      <circle r="4" fill="#67e8f9"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="4" fill="#a5b4fc"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4" fill="#e879f9"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2.8s" begin=".2s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2.8s" begin="1.6s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    </g>

    <circle class="ring" cx="780" cy="160" r="74" fill="none" stroke="#a5b4fc" stroke-opacity=".35" stroke-dasharray="2 10"/>
    <circle class="ring r2" cx="780" cy="160" r="94" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-dasharray="30 14"/>
    <g class="pulse">
      <polygon points="780,100 832,130 832,190 780,220 728,190 728,130" fill="#0b1020" stroke="url(#core)" stroke-width="2.5"/>
      <polygon points="780,114 820,137 820,183 780,206 740,183 740,137" fill="url(#core)" fill-opacity=".14"/>
      <text class="mono" x="780" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">godot_mcp</text>
      <text class="mono" x="780" y="180" text-anchor="middle" font-size="14" fill="#cbd5e1">24 tools</text>
    </g>

    <g class="sans" font-size="17" font-weight="600">
      <g transform="translate(600 66)"><rect x="-70" y="-19" width="140" height="38" rx="19" fill="#0f172a" stroke="#67e8f9" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Claude Code</text></g>
      <g transform="translate(600 160)"><rect x="-82" y="-19" width="164" height="38" rx="19" fill="#0f172a" stroke="#a5b4fc" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Cursor · Codex</text></g>
      <g transform="translate(600 254)"><rect x="-82" y="-19" width="164" height="38" rx="19" fill="#0f172a" stroke="#e879f9" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">GitHub Copilot</text></g>
      <g transform="translate(905 66)"><rect x="-62" y="-19" width="124" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Scenes</text></g>
      <g transform="translate(905 254)"><rect x="-62" y="-19" width="124" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Scripts</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
