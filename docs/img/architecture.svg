<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="484" viewBox="0 0 1100 484" role="img" aria-label="How it works: an AI agent talks MCP to a server (ai-game.dev in Cloud mode, or a local gamedev-mcp-server in Custom mode); the server reaches the godot_mcp editor addon over SignalR; the addon calls the Godot API on the main thread to change scenes, resources, scripts and project settings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151036"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
    <clipPath id="frame"><rect width="1100" height="484" rx="20"/></clipPath>
  </defs>
  <style>
    .sans, text { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono, .mono text { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .head { font-size: 14px; letter-spacing: 2px; fill: #94a3b8; font-weight: 700; }
    .card { fill: #0f172a; stroke: #273454; }
    .t1 { font-size: 19px; font-weight: 600; fill: #f1f5f9; }
    .t2 { font-size: 15px; fill: #a8b3c7; }
    .tag { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .name { font-size: 16px; font-weight: 600; fill: #f1f5f9; }
    .lbl { font-size: 14px; fill: #cbd5e1; font-weight: 600; }
    .wire { fill: none; stroke-width: 2; stroke-dasharray: 5 6; }
    .chip .box { fill: #111c35; stroke: #2c3b5e; }
    .chip text { font-size: 16px; fill: #e2e8f0; }
    .chip .hl { fill: #22d3ee; fill-opacity: .1; stroke: #67e8f9; stroke-width: 1.5; opacity: 0; animation: hl 6s ease-in-out infinite; }
    @keyframes hl { 0%, 18%, 100% { opacity: 0; } 5%, 12% { opacity: 1; } }
    .c2 .hl { animation-delay: 1.2s; } .c3 .hl { animation-delay: 2.4s; } .c4 .hl { animation-delay: 3.6s; } .c5 .hl { animation-delay: 4.8s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1100" height="484" fill="url(#bg)"/>
    <rect width="1100" height="484" fill="url(#dots)"/>
    <text x="32" y="46" class="head">AI AGENT</text>
    <text x="308" y="46" class="head">MCP SERVER</text>
    <text x="584" y="46" class="head">GODOT ADDON</text>
    <text x="860" y="46" class="head">YOUR PROJECT</text>
    <path id="r0" d="M252 220 L308 220" class="wire" stroke="#22d3ee"/><path id="l0" d="M308 246 L252 246" class="wire" stroke="#e879f9"/><path id="r1" d="M528 220 L584 220" class="wire" stroke="#22d3ee"/><path id="l1" d="M584 246 L528 246" class="wire" stroke="#e879f9"/><path id="r2" d="M804 220 L860 220" class="wire" stroke="#22d3ee"/><path id="l2" d="M860 246 L804 246" class="wire" stroke="#e879f9"/>
    <path d="M418.0 390 L418.0 414" class="wire" stroke="#a5b4fc"/>
    <text x="280.0" y="208" text-anchor="middle" class="lbl">MCP</text><text x="556.0" y="208" text-anchor="middle" class="lbl">SignalR</text><text x="832.0" y="208" text-anchor="middle" class="lbl">API</text>
    <circle r="4" fill="#22d3ee"><animateMotion dur="1.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#r0"/></animateMotion></circle><circle r="4" fill="#e879f9"><animateMotion dur="1.2s" begin="2.0s" repeatCount="indefinite"><mpath href="#l0"/></animateMotion></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle><circle r="4" fill="#e879f9"><animateMotion dur="1.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion></circle><circle r="4" fill="#e879f9"><animateMotion dur="1.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
    <rect x="32" y="66" width="220" height="324" rx="14" class="card"/>
    <text x="52" y="102" class="t1">Any MCP client</text>
    <text x="52" y="128" class="t2">calls tools for you</text>
    <g class="chip c1"><rect x="48" y="150" width="188" height="36" rx="8" class="box"/><text x="64" y="174">Claude Code</text></g>
    <g class="chip c2"><rect x="48" y="196" width="188" height="36" rx="8" class="box"/><text x="64" y="220">Cursor</text></g>
    <g class="chip c3"><rect x="48" y="242" width="188" height="36" rx="8" class="box"/><text x="64" y="266">Codex</text></g>
    <g class="chip c4"><rect x="48" y="288" width="188" height="36" rx="8" class="box"/><text x="64" y="312">GitHub Copilot</text></g>
    <g class="chip c5"><rect x="48" y="334" width="188" height="36" rx="8" class="box"/><text x="64" y="358">Gemini, Cline, …</text></g>
    <rect x="308" y="66" width="220" height="324" rx="14" class="card"/>
    <text x="328" y="102" class="t1">Routes tool calls</text>
    <text x="328" y="128" class="t2">one mode at a time</text>
    <rect x="324" y="150" width="188" height="100" rx="10" fill="#111c35" stroke="#67e8f9" stroke-opacity=".6"/>
    <text x="340" y="176" class="tag" fill="#67e8f9">CLOUD · DEFAULT</text>
    <text x="340" y="204" class="name mono">ai-game.dev</text>
    <text x="340" y="232" class="t2">sign in, no hosting</text>
    <rect x="324" y="262" width="188" height="110" rx="10" fill="#111c35" stroke="#e879f9" stroke-opacity=".6"/>
    <text x="340" y="288" class="tag" fill="#e879f9">CUSTOM</text>
    <text x="340" y="314" class="name">gamedev-mcp-server</text>
    <text x="340" y="340" class="t2">local or self-hosted;</text>
    <text x="340" y="361" class="t2">the addon can run it</text>
    <rect x="584" y="66" width="220" height="324" rx="14" class="card" stroke="#8b5cf6" stroke-opacity=".7"/>
    <text x="604" y="102" class="t1 mono">addons/godot_mcp</text>
    <text x="604" y="128" class="t2">24 tools, 9 families</text>
    <g class="chip mono c1"><rect x="600" y="150" width="188" height="36" rx="8" class="box"/><rect x="600" y="150" width="188" height="36" rx="8" class="hl"/><text x="616" y="174">rql-query</text></g>
    <g class="chip mono c2"><rect x="600" y="196" width="188" height="36" rx="8" class="box"/><rect x="600" y="196" width="188" height="36" rx="8" class="hl"/><text x="616" y="220">rql-mutate</text></g>
    <g class="chip mono c3"><rect x="600" y="242" width="188" height="36" rx="8" class="box"/><rect x="600" y="242" width="188" height="36" rx="8" class="hl"/><text x="616" y="266">rql-schema</text></g>
    <g class="chip mono c4"><rect x="600" y="288" width="188" height="36" rx="8" class="box"/><rect x="600" y="288" width="188" height="36" rx="8" class="hl"/><text x="616" y="312">script-*</text></g>
    <g class="chip mono c5"><rect x="600" y="334" width="188" height="36" rx="8" class="box"/><rect x="600" y="334" width="188" height="36" rx="8" class="hl"/><text x="616" y="358">screenshot-*</text></g>
    <rect x="860" y="66" width="220" height="324" rx="14" class="card"/>
    <text x="880" y="102" class="t1">Godot 4.3+ (.NET)</text>
    <text x="880" y="128" class="t2">RQL edits are undoable</text>
    <g class="chip c1"><rect x="876" y="150" width="188" height="36" rx="8" class="box"/><text x="892" y="174">Scene tree, nodes</text></g>
    <g class="chip c2"><rect x="876" y="196" width="188" height="36" rx="8" class="box"/><text x="892" y="220">Scenes .tscn</text></g>
    <g class="chip c3"><rect x="876" y="242" width="188" height="36" rx="8" class="box"/><text x="892" y="266">Resources .tres</text></g>
    <g class="chip c4"><rect x="876" y="288" width="188" height="36" rx="8" class="box"/><text x="892" y="312">Scripts .cs / .gd</text></g>
    <g class="chip c5"><rect x="876" y="334" width="188" height="36" rx="8" class="box"/><text x="892" y="358">Project settings</text></g>
    <rect x="308" y="414" width="772" height="46" rx="10" fill="#0f172a" stroke="#a5b4fc" stroke-opacity=".5" stroke-dasharray="5 5"/>
    <text x="328" y="443" font-size="16" fill="#e2e8f0"><tspan fill="#c4b5fd" font-weight="700">Optional, in a running game:</tspan> GodotMcpRuntime exposes only the tools you register</text>
  </g>
  <rect x=".5" y=".5" width="1099" height="483" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
